[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-multi-relay"
version = "0.1.0"
description = "Multi-relay UAV communication research project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "torch>=2.2"]
learning = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
